<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Turnos Médicos</title>
</head>
<body>
  <nav id="navbar"></nav>
  <main>
    <h1>Crear cuenta</h1>

    <form id="register-form">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required minlength="3">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required minlength="6">

      <label for="password2">Repetir contraseña</label>
      <input type="password" id="password2" name="password2" required minlength="6">

      <button type="submit">Registrarme</button>
    </form>

    <p id="mensaje"></p>

    <p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
  </main>
  <script type="module" src="js/pages/register.js"></script>
</body>
</html>
