<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - Turnos Médicos</title>
</head>
<body>
  <nav id="navbar"></nav>
  <main>
    <h1>Mi perfil</h1>

    <form id="perfil-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" disabled>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required minlength="3">

      <button type="submit">Guardar cambios</button>
    </form>

    <p id="mensaje"></p>
    <h2>Cambiar contraseña</h2>
    <form id="password-form">
      <label for="password-actual">Contraseña actual</label>
      <input type="password" id="password-actual" name="password-actual" required>

      <label for="password-nueva">Contraseña nueva</label>
      <input type="password" id="password-nueva" name="password-nueva" required minlength="6">

      <label for="password-repetida">Repetir contraseña nueva</label>
      <input type="password" id="password-repetida" name="password-repetida" required minlength="6">

      <button type="submit">Cambiar contraseña</button>
    </form>

    <p id="mensaje-password"></p>
  </main>
  <script type="module" src="js/pages/perfil.js"></script>
</body>
</html>
